[package]
name = "netherize_editor"
version = "0.1.0"
edition = "2024"
default-run = "netherize_editor"

[dependencies]
ignore = "0.4"
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
arboard = "3.4.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
cosmic-text = "0.18.2"
font-kit = "0.14.3"
futures-util = "0.3"
notify = "6.1.1"
rfd = "0.14"
pollster = "0.4.0"
portable-pty = "0.9.0"
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
lsp-types = "0.97.0"
toml = "0.8"
swash = "0.2.7"
sysinfo = "0.37.2"
tokio = { version = "1.52.1", features = ["io-util", "rt-multi-thread", "sync", "time", "process", "macros"] }
tokio-util = "0.7"
sha2 = "0.10.9"
similar = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tree-sitter = "0.25.8"
tree-sitter-bash = "0.25.1"
tree-sitter-containerfile = "0.8.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = { version = "0.5.3", default-features = false }
tree-sitter-rust = "0.23.3"
tree-sitter-sequel = "0.3.11"
tree-sitter-typescript = "0.23.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-python = "0.23"
tree-sitter-dart = "0.2.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-proto = "0.4.0"
tree-sitter-xml = "0.7"
streaming-iterator = "0.1.9"
url = "2.5.4"
wgpu = "29.0.1"
winit = "0.30.13"
regex = "1.10"
once_cell = "1"
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = true }

[[bench]]
name = "editor_bench"
harness = false

[[bench]]
name = "e2e_perf_runner"
harness = false

# For profiling / flamegraph (cargo build --profile profiling)
[profile.profiling]
inherits = "release"
debug = true

# Optimized IDE build (cargo build --release)
[profile.release]
opt-level = 3
lto = "thin"          # faster than "fat", still good gains on wgpu/tree-sitter
codegen-units = 1     # single unit → best inlining across crates
strip = "debuginfo"   # remove debug symbols → smaller binary, fast startup
debug = false
panic = "abort"       # removes unwinding machinery (~10% size reduction)

[profile.bench]
debug = true
