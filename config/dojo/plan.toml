# Netherize Dojo plan. Override by copying to ~/.config/netherize/dojo/plan.toml.
# Problems + categories come from neetcode150.toml; the workspace folder and
# the coding language are chosen in the app (dojo.toml).
#
# notebook = "~/Work/docs/interview-notes.md"   # default: <workspace>/notes.md
# sd_dir   = "~/Work/docs/sd"                   # default: <workspace>/sd
dsa_minutes = 25
dsa_phases = [["THINK", 3], ["CODE", 15], ["TEST", 5], ["REVIEW", 2]]
sd_minutes = 45

[[sd_case]]
key = "wallet_v1"
label = "Digital wallet / money transfer (v1)"
topic = "Scaling: LB, replication, sharding, CAP, consistency levels"

[[sd_case]]
key = "url_shortener"
label = "URL shortener"
topic = "Cache-aside vs write-through, invalidation, queue"

[[sd_case]]
key = "rate_limiter"
label = "Distributed rate limiter"
topic = "Storage: SQL vs NoSQL, index, LSM vs B-tree, hot partition"

[[sd_case]]
key = "leaderboard"
label = "Realtime leaderboard"
topic = "Reliability: idempotency, outbox, saga, circuit breaker, backpressure"

[[sd_case]]
key = "feed"
label = "Social feed"
topic = "Fan-out on write vs read"

[[sd_case]]
key = "chat_notification"
label = "Chat / notifications"
topic = "WebSocket, delivery guarantee"

[[sd_case]]
key = "log_metrics"
label = "Log & metrics pipeline"
topic = "Streaming, at-least-once + idempotent consumer"

[[sd_case]]
key = "wallet_v2"
label = "Digital wallet (v2) — compared with v1"
topic = "Operations: observability, rate limiting, safe deploys, feature flags"
