# Netherize Editor — Minimal Keymap Profile
# ============================================================
# Profile tối giản: chỉ những phím cần thiết nhất.
# Không có hjkl, không có leader shortcuts — dùng phím mũi tên thuần túy.
# Phù hợp cho người mới hoặc khi làm việc trên bàn phím không quen.
#
# Để chọn profile này: NETHERIZE_PROFILE=min
# ============================================================

[profile]
name = "min"
description = "Minimal bindings. Arrow keys only for movement. No hjkl, no leader shortcuts."

# ── Global shortcuts ──────────────────────────────────────────────────────────
[[bindings]]
key = "mod+s"
command = "editor.save_file"

[[bindings]]
key = "mod+p"
command = "app.open_file_finder"

[[bindings]]
key = "mod+backslash"
command = "app.toggle_terminal"

# ── Insert mode ───────────────────────────────────────────────────────────────
[[bindings]]
key = "Escape"
mode = "insert"
command = "mode.enter_normal"

[[bindings]]
key = "Backspace"
mode = "insert"
command = "editor.backspace"

[[bindings]]
key = "Enter"
mode = "insert"
command = "editor.newline"

[[bindings]]
key = "ArrowLeft"
mode = "insert"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "insert"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "insert"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "insert"
command = "editor.move_down"

# ── Normal mode — arrow keys only, no hjkl ───────────────────────────────────
[[bindings]]
key = "Escape"
mode = "normal"
command = "mode.enter_normal"

[[bindings]]
key = "i"
mode = "normal"
command = "mode.enter_insert"

[[bindings]]
key = "ArrowLeft"
mode = "normal"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "normal"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "normal"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "normal"
command = "editor.move_down"

# ── Visual mode ───────────────────────────────────────────────────────────────
[[bindings]]
key = "Escape"
mode = "visual"
command = "mode.enter_normal"

[[bindings]]
key = "ArrowLeft"
mode = "visual"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "visual"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "visual"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "visual"
command = "editor.move_down"

# No leader shortcuts in minimal profile.
# Use Cmd/Ctrl+P to open file finder, Cmd/Ctrl+S to save.
