key = "w"
command = "editor.move_word_forward"

[[bindings]]
mode = "normal"
key = "b"
command = "editor.move_word_backward"

[[bindings]]
mode = "normal"
key = "e"
command = "editor.move_word_end"

# line motions
[[bindings]]
mode = "normal"
key = "0"
command = "editor.move_to_line_start"

[[bindings]]
mode = "normal"
key = "$"
command = "editor.move_to_line_end"

[[bindings]]
mode = "normal"
key = "^"
command = "editor.move_to_first_non_whitespace"

# edit
[[bindings]]
mode = "normal"
key = "I"
command = "editor.insert_at_line_start"

[[bindings]]
mode = "normal"
key = "A"
command = "editor.append_at_line_end"

[[bindings]]
mode = "normal"
key = "C"
command = "editor.change_to_line_end"

[[bindings]]
mode = "normal"
key = "a"
command = "editor.append_after_cursor"

[[bindings]]
mode = "normal"
key = "o"
command = "editor.insert_line_below"

[[bindings]]
mode = "normal"
key = "O"
command = "editor.insert_line_above"

[[bindings]]
mode = "normal"
key = "x"
command = "editor.delete_char"

# `yy` và `ye` được xử lý trong InputHandler yank-pending để dùng chung
# flow với `yi(` / `ya{`, nên không khai báo static chord ở đây.

[[bindings]]
mode = "normal"
key = "g c c"
command = "editor.toggle_line_comment"

[[bindings]]
mode = "normal"
key = "<leader>f m"
command = "lsp.format_document"

# `r<char>` cần payload ký tự động nên được xử lý trong InputHandler pending state,
# không khai báo static binding ở đây.

# undo redo
[[bindings]]
mode = "normal"
key = "u"
command = "editor.undo"

[[bindings]]
mode = "normal"
key = "Ctrl+r"
command = "editor.redo"

[[bindings]]
mode = "normal"
key = "mod+v"
command = "editor.paste"

[[bindings]]
