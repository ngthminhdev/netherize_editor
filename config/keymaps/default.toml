# Netherize Editor — Unified Neovim Profile (Final Clean)
# ============================================================

[profile]
name = "nvim-ultimate"
description = "Clean full Neovim-style profile (block TOML, no inline bindings)"

[meta]
leader = "space"

# ───────────────── GLOBAL ─────────────────
[[bindings]]
key = "mod+s"
command = "editor.save_file"

[[bindings]]
key = "mod+o"
command = "editor.open_folder"

[[bindings]]
key = "mod+p"
command = "app.open_command_palette"

[[bindings]]
key = "mod+b"
command = "app.toggle_left_dock"

[[bindings]]
key = "mod+f"
command = "app.focus_explorer"

[[bindings]]
key = "F12"
command = "app.focus_terminal"

[[bindings]]
key = "mod+backslash"
command = "app.toggle_bottom_dock"

[[bindings]]
key = "mod+w"
command = "app.focus_back"

[[bindings]]
mode = "normal"
key = "mod+,"
command = "app.open_settings"

# [[bindings]]
# key = "Ctrl+="
# command = "ui.scale_up"

# [[bindings]]
# key = "Ctrl+-"
# command = "ui.scale_down"

# [[bindings]]
# key = "Ctrl+0"
# command = "ui.scale_reset"

# [[bindings]]
