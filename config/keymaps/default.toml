key = "ArrowDown"
command = "editor.move_down"

[[bindings]]
mode = "insert"
key = "mod+v"
command = "editor.paste"

[[bindings]]
mode = "insert"
key = "Ctrl+j"
command = "ai.accept_inline"

# [[bindings]]
# mode = "insert"
# key = "Ctrl+k"
