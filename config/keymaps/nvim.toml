# Netherize Editor — Neovim-Style Keymap Profile
# ============================================================
# Profile mô phỏng workflow Neovim của user (NvChad-inspired, leader=Space).
# Chỉ bind những command đã có backing trong Netherize; các binding LSP/Git/AI
# trong profile Neovim gốc sẽ được nối dần khi command tương ứng xuất hiện.
#
# Chọn profile: NETHERIZE_PROFILE=nvim
# ============================================================

[profile]
name = "nvim"
description = "Neovim-flavored bindings. Leader = Space. hjkl trong Normal/Visual; Insert vẫn giữ arrow keys."

# ── Global shortcuts (mod = Cmd trên macOS, Ctrl nơi khác) ───────────────────
[[bindings]]
key = "mod+s"
command = "editor.save_file"

[[bindings]]
key = "mod+o"
command = "editor.open_file"

[[bindings]]
key = "mod+p"
command = "app.open_file_picker"

[[bindings]]
key = "mod+shift+p"
command = "app.open_command_palette"

[[bindings]]
key = "mod+e"
command = "app.toggle_explorer"

[[bindings]]
key = "mod+f"
command = "app.focus_explorer"

[[bindings]]
key = "mod+backslash"
command = "app.toggle_terminal"

[[bindings]]
key = "mod+backtick"
command = "app.toggle_terminal"

[[bindings]]
key = "mod+w"
command = "app.focus_back"

# Buffer cycling — <C-l>/<C-h>
[[bindings]]
key = "mod+l"
command = "buffer.next"

[[bindings]]
key = "mod+h"
command = "buffer.prev"

[[bindings]]
key = "F12"
command = "app.focus_terminal"

# ── Insert mode — arrow keys vẫn available ───────────────────────────────────
[[bindings]]
key = "Escape"
mode = "insert"
command = "mode.enter_normal"

[[bindings]]
key = "Backspace"
mode = "insert"
command = "editor.backspace"

[[bindings]]
key = "Enter"
mode = "insert"
command = "editor.newline"

[[bindings]]
key = "ArrowLeft"
mode = "insert"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "insert"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "insert"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "insert"
command = "editor.move_down"

# ── Normal mode ──────────────────────────────────────────────────────────────
[[bindings]]
key = "Escape"
mode = "normal"
command = "mode.enter_normal"

[[bindings]]
key = "i"
mode = "normal"
command = "mode.enter_insert"

[[bindings]]
key = "v"
mode = "normal"
command = "mode.enter_visual"

[[bindings]]
key = "V"
mode = "normal"
command = "mode.enter_visual_line"

[[bindings]]
key = "o"
mode = "normal"
command = "editor.insert_line_below"

[[bindings]]
key = "O"
mode = "normal"
command = "editor.insert_line_above"

[[bindings]]
key = "I"
mode = "normal"
command = "editor.insert_at_line_start"

[[bindings]]
key = "A"
mode = "normal"
command = "editor.append_at_line_end"

[[bindings]]
key = "a"
mode = "normal"
command = "editor.append_after_cursor"

[[bindings]]
key = "S"
mode = "normal"
command = "editor.substitute_line"

[[bindings]]
key = "x"
mode = "normal"
command = "editor.delete_char"

[[bindings]]
key = "u"
mode = "normal"
command = "editor.undo"

[[bindings]]
key = "Ctrl+r"
mode = "normal"
command = "editor.redo"

[[bindings]]
key = "h"
mode = "normal"
command = "editor.move_left"

[[bindings]]
key = "j"
mode = "normal"
command = "editor.move_down"

[[bindings]]
key = "k"
mode = "normal"
command = "editor.move_up"

[[bindings]]
key = "l"
mode = "normal"
command = "editor.move_right"

[[bindings]]
key = "ArrowLeft"
mode = "normal"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "normal"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "normal"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "normal"
command = "editor.move_down"

[[bindings]]
key = "backtick"
mode = "normal"
command = "app.toggle_terminal"

[[bindings]]
key = "z z"
mode = "normal"
command = "editor.center_cursor_line"

[[bindings]]
key = ":"
mode = "normal"
command = "app.open_vim_command"

# ── Operator + motion chords (normal mode) ───────────────────────────────────
# Engine: input_map::resolve_sequence_* (literal step match). Mỗi entry là
# một "nhịp" theo cú pháp TOML — parser tự chia sequence theo whitespace.
# Để mở rộng tiếp (vd. "d 0", "d $", "d G"), chỉ cần thêm dòng mới, không
# cần đụng vào Rust code.

# `dd` đã có trong builtin_defaults; khai báo lại để nvim profile tự-đủ.
[[bindings]]
key = "d d"
mode = "normal"
command = "editor.delete_current_line"

# `dw` — xóa từ con trỏ tới đầu từ kế tiếp (bao gồm whitespace theo sau).
[[bindings]]
key = "d w"
mode = "normal"
command = "editor.delete_word_forward"

[[bindings]]
key = "d b"
mode = "normal"
command = "editor.delete_word_backward"

[[bindings]]
key = "c w"
mode = "normal"
command = "editor.change_word_forward"

[[bindings]]
key = "c b"
mode = "normal"
command = "editor.change_word_backward"

# `r<char>` dùng payload ký tự động nên được route ở InputHandler pending state,
# không map thành static key binding trong TOML.

# ── Visual mode ──────────────────────────────────────────────────────────────
