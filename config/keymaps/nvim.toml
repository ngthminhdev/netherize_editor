command = "editor.move_to_first_non_whitespace"

[[bindings]]
key = "g g"
mode = "visual"
command = "editor.move_to_first_line"

[[bindings]]
key = "G"
mode = "visual"
command = "editor.move_to_last_line"

[[bindings]]
key = "d"
mode = "visual"
command = "editor.delete_selection"

[[bindings]]
key = "c"
mode = "visual"
command = "editor.change_selection"

[[bindings]]
key = "x"
mode = "visual"
command = "editor.delete_selection"

[[bindings]]
key = "ArrowLeft"
mode = "visual"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "visual"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "visual"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "visual"
command = "editor.move_down"

[[bindings]]
key = "backtick"
mode = "visual"
command = "app.toggle_terminal"

# ── Leader (Space) — Window / Panel focus ────────────────────────────────────
# Map `<leader>hjkl` theo phong cách window.focus_left/down/up/right của user.
# Trong workbench layout: left sidebar = Explorer, right sidebar = Inspector,
# bottom = Terminal, center = Editor.
[[bindings]]
key = "<leader>h"
command = "app.focus_left"

[[bindings]]
key = "<leader>l"
command = "app.focus_right"

[[bindings]]
key = "<leader>j"
command = "app.focus_down"

[[bindings]]
key = "<leader>k"
command = "app.focus_up"

# Alias ngắn (y hệt workflow cũ).
[[bindings]]
key = "<leader>e"
command = "app.focus_explorer"

[[bindings]]
key = "<leader>i"
command = "app.focus_inspector"

[[bindings]]
key = "<leader>b"
command = "app.focus_terminal"

# ── Leader — Palette / Telescope analogs ─────────────────────────────────────
[[bindings]]
key = "<leader>p"
command = "app.open_command_palette"

[[bindings]]
key = "<leader>f f"
command = "app.open_file_finder"

[[bindings]]
key = "<leader>f w"
command = "app.search_in_files"

# `<leader>fp` trong profile user = document_symbols; ta dùng workspace symbols.
[[bindings]]
key = "<leader>f p"
command = "app.open_workspace_symbols"

# ── Leader — Terminal / Save / Tab ───────────────────────────────────────────
[[bindings]]
key = "<leader>t"
command = "app.toggle_terminal"

[[bindings]]
key = "<leader>w"
command = "editor.save_file"

# `<leader>tn` trong profile user = tab.next.
[[bindings]]
key = "<leader>t n"
command = "buffer.next"

[[bindings]]
key = "<leader>t p"
command = "buffer.prev"

[[bindings]]
key = "<leader>t c"
command = "buffer.close_current"

[[bindings]]
key = "<leader>b n"
command = "buffer.new"
