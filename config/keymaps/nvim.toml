# Netherize Editor — Neovim-Style Keymap Profile
# ============================================================
# Profile cho người dùng Neovim thuần thục.
# Điểm khác biệt chính so với "default":
#   • hjkl hoạt động trong CẢ Insert mode (không chỉ Normal/Visual)
#   • Phím mũi tên bị vô hiệu hoá trong Insert mode để ép học hjkl
#   • Backtick mở terminal ở cả Normal và Visual mode
#
# Để chọn profile này: NETHERIZE_PROFILE=nvim
# ============================================================

[profile]
name = "nvim"
description = "Neovim-flavored bindings. hjkl movement enabled in Insert mode; arrow keys disabled in Insert to enforce muscle memory."

# ── Global shortcuts ──────────────────────────────────────────────────────────
[[bindings]]
key = "mod+s"
command = "editor.save_file"

[[bindings]]
key = "mod+o"
command = "editor.open_file"

[[bindings]]
key = "mod+p"
command = "app.open_file_finder"

[[bindings]]
key = "mod+e"
command = "app.toggle_explorer"

[[bindings]]
key = "mod+backslash"
command = "app.toggle_terminal"

# ── Insert mode — hjkl movement (extra, phím mũi tên vẫn giữ) ────────────────
[[bindings]]
key = "Escape"
mode = "insert"
command = "mode.enter_normal"

[[bindings]]
key = "Backspace"
mode = "insert"
command = "editor.backspace"

[[bindings]]
key = "Enter"
mode = "insert"
command = "editor.newline"

# Arrow keys still available (unlike strict vim mode)
[[bindings]]
key = "ArrowLeft"
mode = "insert"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "insert"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "insert"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "insert"
command = "editor.move_down"

# ── Normal mode ───────────────────────────────────────────────────────────────
[[bindings]]
key = "Escape"
mode = "normal"
command = "mode.enter_normal"

[[bindings]]
key = "i"
mode = "normal"
command = "mode.enter_insert"

[[bindings]]
key = "v"
mode = "normal"
command = "mode.enter_visual"

[[bindings]]
key = "h"
mode = "normal"
command = "editor.move_left"

[[bindings]]
key = "j"
mode = "normal"
command = "editor.move_down"

[[bindings]]
key = "k"
mode = "normal"
command = "editor.move_up"

[[bindings]]
key = "l"
mode = "normal"
command = "editor.move_right"

[[bindings]]
key = "ArrowLeft"
mode = "normal"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "normal"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "normal"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "normal"
command = "editor.move_down"

[[bindings]]
key = "backtick"
mode = "normal"
command = "app.toggle_terminal"

# ── Visual mode ───────────────────────────────────────────────────────────────
[[bindings]]
key = "Escape"
mode = "visual"
command = "mode.enter_normal"

[[bindings]]
key = "h"
mode = "visual"
command = "editor.move_left"

[[bindings]]
key = "j"
mode = "visual"
command = "editor.move_down"

[[bindings]]
key = "k"
mode = "visual"
command = "editor.move_up"

[[bindings]]
key = "l"
mode = "visual"
command = "editor.move_right"

[[bindings]]
key = "ArrowLeft"
mode = "visual"
command = "editor.move_left"

[[bindings]]
key = "ArrowRight"
mode = "visual"
command = "editor.move_right"

[[bindings]]
key = "ArrowUp"
mode = "visual"
command = "editor.move_up"

[[bindings]]
key = "ArrowDown"
mode = "visual"
command = "editor.move_down"

[[bindings]]
key = "backtick"
mode = "visual"
command = "app.toggle_terminal"

# ── Leader prefix (Space = leader) ───────────────────────────────────────────
[[bindings]]
key = "<leader>f"
command = "app.open_file_finder"

[[bindings]]
key = "<leader>p"
command = "app.open_command_palette"

[[bindings]]
key = "<leader>t"
command = "app.toggle_terminal"

[[bindings]]
key = "<leader>w"
command = "editor.save_file"

[[bindings]]
key = "<leader>e"
command = "app.focus_explorer"

[[bindings]]
key = "<leader>i"
command = "app.focus_inspector"

[[bindings]]
key = "<leader>b"
command = "app.focus_terminal"

# ── Focus navigation ──────────────────────────────────────────────────────────
[[bindings]]
key = "mod+w"
command = "app.focus_back"
