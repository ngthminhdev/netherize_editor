command = "editor.move_left"

[[bindings]]
key = "j"
mode = "visual"
command = "editor.move_down"

[[bindings]]
key = "k"
mode = "visual"
command = "editor.move_up"

[[bindings]]
key = "l"
mode = "visual"
command = "editor.move_right"

[[bindings]]
key = "w"
mode = "visual"
command = "editor.move_word_forward"

[[bindings]]
key = "b"
mode = "visual"
command = "editor.move_word_backward"

[[bindings]]
key = "e"
mode = "visual"
command = "editor.move_word_end"

[[bindings]]
