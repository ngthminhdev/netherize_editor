[window]
title = "Netherize Editor"
width = 1920
height = 1080
startup_mode = "windowed"
auto_scale = true
min_content_scale = 1.0
max_content_scale = 2.0

[layout]
region_gap = 2.0
top_bar_height = 34.0
status_bar_height = 22.0
center_min_width = 320.0
center_min_height = 180.0
sidebar_min_width = 180.0
bottom_min_height = 120.0

[docks]
left_visible = false
left_size_px = 280.0
right_visible = false
right_size_px = 300.0
bottom_visible = false
bottom_size_px = 500.0
overlay_visible = false

[cursor]
shape = "nvim"
beam_width = 1.8
block_width = 10.0
underline_height = 2.0

[spacing]
editor_padding = 14.0
panel_padding = 10.0
explorer_padding = 10.0

[status_bar]
padding_x = 14.0
font_size = 11.0
line_height = 14.0

[editor]
relative_numbers = true
smooth_scroll_enabled = true
smooth_scroll_lerp_rate = 18.0
smooth_scroll_snap_epsilon = 0.01

[welcome]
version = "v0.3.1-alpha"
card_max_width = 560.0
card_padding_x = 42.0
card_padding_y = 34.0
section_gap = 16.0
border_radius_px = 18.0
