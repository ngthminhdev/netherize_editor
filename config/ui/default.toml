[window]
title = "Netherize Editor"
width = 1920
height = 1080
startup_mode = "windowed"
# Keep UI size independent of window size (stable like other IDEs).
# When true, content zooms with window size relative to width/height above.
auto_scale = false
min_content_scale = 1.0
max_content_scale = 2.0
# Force a specific scale factor / DPI override globally (e.g. 1.0 on a Full HD monitor to avoid excessive scaling)
# scale_factor_override = 1.0

[layout]
outer_gap = 14.0
panel_gap = 14.0
inner_padding = 12.0
round_ui = true
top_bar_height = 34.0
status_bar_height = 28.0
center_min_width = 320.0
center_min_height = 180.0
sidebar_min_width = 180.0
bottom_min_height = 120.0
panel_border_width = 1.0

[docks]
left_visible = false
left_size_px = 300.0
right_visible = false
right_size_px = 600.0
bottom_visible = false
bottom_size_px = 400.0
overlay_visible = false

[cursor]
shape = "nvim"
beam_width = 1.8
block_width = 10.0
underline_height = 2.0

[spacing]
editor_padding = 14.0
panel_padding = 10.0
explorer_padding = 10.0
topbar_dirty_gap = 6.0

[status_bar]
padding_x = 16.0
font_size = 13.0
line_height = 21.0

[editor]
relative_numbers = true
smooth_scroll_enabled = true
smooth_scroll_lerp_rate = 18.0
smooth_scroll_snap_epsilon = 0.01

[indent]
tab_width = 4
insert_spaces = true

[animation]
enabled = true
dock_duration_ms = 150
overlay_duration_ms = 280
curve = "ease_out_cubic"

[welcome]
version = "v1.0.8-alpha"
card_max_width = 560.0
card_padding_x = 42.0
card_padding_y = 34.0
section_gap = 16.0
border_radius_px = 18.0
