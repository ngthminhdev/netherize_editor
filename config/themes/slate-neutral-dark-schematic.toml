selection_bg = "#313744"
dirty_indicator = "#d7b26d"

fg = "#d0d7e4"
fg_dim = "#b7bdc9"
fg_ghost = "#8790a1"

accent = "#9ca7ba"
cyan = "#9fb0c9"
magenta = "#caaecf"
amber = "#d0bc8a"
