[theme]
name = "vscode_dark"
description = "VS Code Dark+ — the classic default dark theme from Visual Studio Code"

[editor]
bg = "#1E1E1E"
fg = "#D4D4D4"
cursor = "#AEAFAD"
selection = "#264F78"
gutter = "#1E1E1E"
gutter_active = "#D4D4D4"
indent_guide = "#40404040"
rainbow_brackets = ["#FFD700", "#DA70D6", "#179FFF", "#FFD700", "#DA70D6", "#179FFF"]
font_size = 14.0
line_height = 22.0
font_family = "Google Sans Code"
nerd_font_family = "Hack Nerd Font"

[ui]
bg = "#181818"
sidebar_bg = "#1E1E1E"
panel_bg = "#1E1E1E"
terminal_bg = "#1E1E1E"
overlay_bg = "#252526D9"
status_bar_bg = "#1E1E1E"
border_color = "#3C3C3C"
selection_bg = "#094771"
dirty_indicator = "#E8AB53"

fg = "#D4D4D4"
fg_dim = "#808080"
fg_ghost = "#5A5A5A"

accent = "#007ACC"
cyan = "#4EC9B0"
magenta = "#C586C0"
amber = "#D7BA7D"
success = "#6A9955"
warning = "#CCA700"
info = "#73D0FF"
error = "#F44747"

mode_normal = "#4FC1FF"
mode_insert = "#6A9955"
mode_visual = "#C586C0"

sidebar_font_size = 14.0
sidebar_line_height = 22.0
panel_font_size = 14.0
panel_line_height = 22.0

sidebar_width = 280.0
right_sidebar_width = 540.0
bottom_panel_height = 220.0
top_bar_height = 36.0

[git]
modified_sidebar = "#E8AB53"
added_sidebar = "#6A9955"
modified_gutter = "#E8AB53"
added_gutter = "#6A9955"
deleted_gutter = "#F44747"
status_bar_height = 32.0


[syntax]
keyword = "#569CD6"
operator = "#D4D4D4"
punctuation = "#D4D4D4"
string = "#CE9178"
number = "#B5CEA8"
boolean = "#569CD6"
escape = "#D7BA7D"
identifier = "#D4D4D4"
variable = "#9CDCFE"
function = "#DCDCAA"
macro = "#569CD6"
parameter = "#9CDCFE"
type = "#4EC9B0"
constructor = "#4EC9B0"
field = "#9CDCFE"
property = "#9CDCFE"
constant = "#4FC1FF"
comment = "#6A9955"
attribute = "#DCDCAA"
namespace = "#4EC9B0"
lifetime = "#569CD6"
tag = "#569CD6"
