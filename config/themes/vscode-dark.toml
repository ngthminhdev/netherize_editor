[theme]
name = "vscode_dark"
description = "VS Code Dark+ — the classic default dark theme from Visual Studio Code"

[editor]
bg = "#1E1E1E"
fg = "#D4D4D4"
cursor = "#AEAFAD"
selection = "#264F78"
gutter = "#1E1E1E"
gutter_active = "#D4D4D4"
indent_guide = "#40404040"
rainbow_brackets = ["#FFD700", "#DA70D6", "#179FFF", "#FFD700", "#DA70D6", "#179FFF"]

[ui]
bg = "#181818"
sidebar_bg = "#1E1E1E"
panel_bg = "#1E1E1E"
terminal_bg = "#1E1E1E"
overlay_bg = "#252526D9"
status_bar_bg = "#1E1E1E"
border_color = "#3C3C3C"
selection_bg = "#094771"
dirty_indicator = "#E8AB53"

fg = "#D4D4D4"
fg_dim = "#808080"
fg_ghost = "#5A5A5A"

accent = "#007ACC"
cyan = "#4EC9B0"
magenta = "#C586C0"
amber = "#D7BA7D"
success = "#6A9955"
warning = "#CCA700"
info = "#73D0FF"
error = "#F44747"

mode_normal = "#4FC1FF"
mode_insert = "#6A9955"
mode_visual = "#C586C0"

top_bar_height = 36.0

[git]
modified_sidebar = "#E8AB53"
added_sidebar = "#6A9955"
modified_gutter = "#E8AB53"
added_gutter = "#6A9955"
deleted_gutter = "#F44747"
status_bar_height = 32.0

[syntax]
keyword = "#569cd6"
operator = "#d4d4d4"
punctuation = "#d4d4d4"
string = "#ce9178"
number = "#b5cea8"
boolean = "#569cd6"
escape = "#d7ba7d"
identifier = "#d4d4d4"
variable = "#9cdcfe"
function = "#dcdcaa"
macro = "#569cd6"
parameter = "#9cdcfe"
type = "#4ec9b0"
constructor = "#4ec9b0"
field = "#4ec9b0"
property = "#4ec9b0"
constant = "#4fc1ff"
comment = "#6a9955"
attribute = "#569cd6"
namespace = "#4ec9b0"
lifetime = "#569cd6"
tag = "#569cd6"
keyword_control = "#569cd6"
keyword_storage = "#569cd6"
string_escape = "#d7ba7d"
function_builtin = "#dcdcaa"
comment_doc = "#6a9955"
type_builtin = "#4ec9b0"
variable_builtin = "#9cdcfe"
markup_strong = "#569cd6"
markup_italic = "#6a9955"
markup_inline_code = "#ce9178"
markup_link = "#dcdcaa"

