[theme]
name = "nord_frost"
description = "Cool nord-inspired theme with icy blue tones for Netherize Editor"

[editor]
bg = "#2E3440"
fg = "#D8DEE9"
cursor = "#88C0D0"
selection = "#434C5E"
gutter = "#2E3440"
gutter_active = "#D8DEE9"

[ui]
bg = "#242933"
sidebar_bg = "#2E3440"
panel_bg = "#2E3440"
terminal_bg = "#191D24"
overlay_bg = "#242933D9"
status_bar_bg = "#2E3440"
border_color = "#3B4252"
selection_bg = "#4C566A"

fg = "#D8DEE9"
fg_dim = "#81A1C1"
fg_ghost = "#616E88"

accent = "#88C0D0"
cyan = "#8FBCBB"
magenta = "#B48EAD"
amber = "#EBCB8B"
success = "#A3BE8C"
warning = "#D08770"
info = "#88C0D0"
error = "#BF616A"

mode_normal = "#88C0D0"
mode_insert = "#A3BE8C"
mode_visual = "#B48EAD"


top_bar_height = 36.0

[git]
modified_sidebar = "#EBCB8B"
added_sidebar = "#A3BE8C"
modified_gutter = "#EBCB8B"
added_gutter = "#A3BE8C"
deleted_gutter = "#BF616A"
status_bar_height = 32.0


[syntax]
keyword = "#81a1c1"       # Blue (Nord identity)
string = "#a3be8c"
function = "#88c0d0"
comment = "#616e88"
type = "#8fbcbb"
number = "#b48ead"
identifier = "#d8dee9"    # Foreground (cho variable references)
parameter = "#ebcb8b"     # Amber (Nord palette)
field = "#8fbcbb"         # Teal (Nord palette)
property = "#8fbcbb"      # Teal (đồng bộ với field)
constant = "#b48ead"
operator = "#81a1c1"      # Blue (Nord palette)
punctuation = "#d8dee9"
macro = "#8fbcbb"
lifetime = "#ebcb8b"
boolean = "#d08770"
escape = "#d08770"
variable = "#d08770"      # Orange (khác với identifier #d8dee9)
constructor = "#88c0d0"
attribute = "#81a1c1"     # Blue (đồng bộ keyword)
namespace = "#81a1c1"
tag = "#81a1c1"
keyword_control = "#81a1c1"       # Blue (Nord identity)
keyword_storage = "#81a1c1"       # Blue (Nord identity)
string_escape = "#d08770"
function_builtin = "#88c0d0"
comment_doc = "#616e88"
type_builtin = "#8fbcbb"
variable_builtin = "#d08770"      # Orange (khác với identifier #d8dee9)
markup_strong = "#81a1c1"       # Blue (Nord identity)
markup_italic = "#616e88"
markup_inline_code = "#a3be8c"
markup_link = "#88c0d0"
