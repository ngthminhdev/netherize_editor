[theme]
name = "aura_dark"
description = "Aura Dark — dark theme with soft pastel purple tones"

[editor]
bg = "#15141B"
fg = "#EDECEE"
cursor = "#A277FF"
selection = "#2D2B38"
gutter = "#15141B"
gutter_active = "#EDECEE"
indent_guide = "#6D6A7E40"
rainbow_brackets = ["#FFCA85", "#61FFCA", "#A277FF", "#F694FF", "#FFCA85", "#61FFCA"]
font_size = 14.0
line_height = 22.0
font_family = "Google Sans Code"
nerd_font_family = "Hack Nerd Font"

[ui]
bg = "#121118"
sidebar_bg = "#15141B"
panel_bg = "#15141B"
terminal_bg = "#0F0E14"
overlay_bg = "#121118D9"
status_bar_bg = "#15141B"
border_color = "#2D2B38"
selection_bg = "#3D3A4A"
dirty_indicator = "#FFCA85"

fg = "#EDECEE"
fg_dim = "#A39DB8"
fg_ghost = "#6D6A7E"

accent = "#A277FF"
cyan = "#61FFCA"
magenta = "#F694FF"
amber = "#FFCA85"
success = "#61FFCA"
warning = "#FFCA85"
info = "#73D0FF"
error = "#FF6767"

mode_normal = "#61FFCA"
mode_insert = "#A277FF"
mode_visual = "#F694FF"

sidebar_font_size = 14.0
sidebar_line_height = 22.0
panel_font_size = 14.0
panel_line_height = 22.0

sidebar_width = 280.0
right_sidebar_width = 540.0
bottom_panel_height = 220.0
top_bar_height = 36.0

[git]
modified_sidebar = "#FFCA85"
added_sidebar = "#61FFCA"
modified_gutter = "#FFCA85"
added_gutter = "#61FFCA"
deleted_gutter = "#FF6767"
status_bar_height = 32.0


[syntax]
keyword = "#A277FF"
operator = "#EDECEE"
punctuation = "#A39DB8"
string = "#61FFCA"
number = "#FFCA85"
boolean = "#FFCA85"
escape = "#FF6767"
identifier = "#EDECEE"
variable = "#EDECEE"
function = "#FFCA85"
macro = "#F694FF"
parameter = "#F694FF"
type = "#61FFCA"
constructor = "#61FFCA"
field = "#73D0FF"
property = "#EDECEE"
constant = "#FFCA85"
comment = "#6D6A7E"
attribute = "#FFCA85"
namespace = "#A277FF"
lifetime = "#FFCA85"
tag = "#F694FF"
