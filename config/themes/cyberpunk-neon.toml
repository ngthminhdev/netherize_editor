[theme]
name = "cyberpunk_neon"
description = "High contrast neon cyberpunk theme for Netherize Editor"

[editor]
bg = "#0D0D0D"
fg = "#EAEAEA"
cursor = "#00FFF7"
selection = "#1F1F1F"
gutter = "#0D0D0D"
gutter_active = "#EAEAEA"
font_size = 14.0
line_height = 22.0
font_family = "Google Sans Code"
nerd_font_family = "Hack Nerd Font"

[ui]
bg = "#080808"
sidebar_bg = "#0D0D0D"
panel_bg = "#0D0D0D"
terminal_bg = "#000000"
overlay_bg = "#080808D9"
status_bar_bg = "#0D0D0D"
border_color = "#222222"
selection_bg = "#2A2A2A"

fg = "#EAEAEA"
fg_dim = "#888888"
fg_ghost = "#555555"

accent = "#00FFF7"
cyan = "#00FFF7"
magenta = "#FF00FF"
amber = "#FFD700"
success = "#00FF9F"
warning = "#FF9F00"
info = "#00FFF7"
error = "#FF0055"

mode_normal = "#00FFF7"
mode_insert = "#00FF9F"
mode_visual = "#FF00FF"

sidebar_font_size = 14.0
sidebar_line_height = 22.0
panel_font_size = 14.0
panel_line_height = 22.0

sidebar_width = 280.0
right_sidebar_width = 540.0
bottom_panel_height = 220.0
top_bar_height = 36.0

[git]
modified_sidebar = "#FFD700"
added_sidebar = "#00FF9F"
modified_gutter = "#FFD700"
added_gutter = "#00FF9F"
deleted_gutter = "#FF0055"
status_bar_height = 32.0


[syntax]
keyword = "#FF00FF"
string = "#FFD700"
function = "#00FFF7"
comment = "#555555"
type = "#00FFF7"
number = "#FF9F00"
identifier = "#EAEAEA"
parameter = "#FFD700"
field = "#00FFF7"
property = "#00FFF7"
constant = "#FF00FF"
operator = "#FF00FF"
punctuation = "#EAEAEA"
macro = "#00FFF7"
lifetime = "#FF9F00"
boolean = "#00FF9F"
escape = "#FF9F00"
variable = "#EAEAEA"
constructor = "#FF00FF"
attribute = "#FFD700"
namespace = "#00FFF7"
tag = "#FF0055"
