[theme]
name = "cyberpunk_neon"
description = "High contrast neon cyberpunk theme for Netherize Editor"

[editor]
bg = "#0D0D0D"
fg = "#EAEAEA"
cursor = "#00FFF7"
selection = "#1F1F1F"
gutter = "#0D0D0D"
gutter_active = "#EAEAEA"

[ui]
bg = "#080808"
sidebar_bg = "#0D0D0D"
panel_bg = "#0D0D0D"
terminal_bg = "#000000"
overlay_bg = "#080808D9"
status_bar_bg = "#0D0D0D"
border_color = "#222222"
selection_bg = "#2A2A2A"

fg = "#EAEAEA"
fg_dim = "#888888"
fg_ghost = "#555555"

accent = "#00FFF7"
cyan = "#00FFF7"
magenta = "#FF00FF"
amber = "#FFD700"
success = "#00FF9F"
warning = "#FF9F00"
info = "#00FFF7"
error = "#FF0055"

mode_normal = "#00FFF7"
mode_insert = "#00FF9F"
mode_visual = "#FF00FF"


top_bar_height = 36.0

[git]
modified_sidebar = "#FFD700"
added_sidebar = "#00FF9F"
modified_gutter = "#FFD700"
added_gutter = "#00FF9F"
deleted_gutter = "#FF0055"
status_bar_height = 32.0


[syntax]
keyword = "#ff00ff"       # Magenta (Cyberpunk identity)
string = "#ffd700"
function = "#00fff7"
comment = "#555555"
type = "#00fff7"
number = "#ff9f00"
identifier = "#eaeaea"    # Foreground (cho variable references)
parameter = "#ffb86c"     # Orange (Cyberpunk palette)
field = "#00fff7"         # Cyan (Cyberpunk palette)
property = "#00fff7"      # Cyan (đồng bộ với field)
constant = "#ff00ff"
operator = "#ff00ff"      # Magenta (Cyberpunk palette)
punctuation = "#eaeaea"
macro = "#00fff7"
lifetime = "#ff9f00"
boolean = "#00ff9f"
escape = "#ff9f00"
variable = "#ff6ec7"      # Pink (khác với identifier #eaeaea)
constructor = "#ff00ff"
attribute = "#ff00ff"     # Magenta (đồng bộ keyword)
namespace = "#00fff7"
tag = "#ff0055"
keyword_control = "#ff00ff"       # Magenta (Cyberpunk identity)
keyword_storage = "#ff00ff"       # Magenta (Cyberpunk identity)
string_escape = "#ff9f00"
function_builtin = "#00fff7"
comment_doc = "#555555"
type_builtin = "#00fff7"
variable_builtin = "#ff6ec7"      # Pink (khác với identifier #eaeaea)
markup_strong = "#ff00ff"       # Magenta (Cyberpunk identity)
markup_italic = "#555555"
markup_inline_code = "#ffd700"
markup_link = "#00fff7"
