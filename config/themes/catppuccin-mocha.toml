macro = "#F5C2E7"
parameter = "#EBA0AC"
type = "#F9E2AF"
constructor = "#F9E2AF"
field = "#89DCEB"
property = "#B4BEFE"
constant = "#FAB387"
comment = "#6C7086"
attribute = "#F9E2AF"
namespace = "#CBA6F7"
lifetime = "#FAB387"
tag = "#F38BA8"
