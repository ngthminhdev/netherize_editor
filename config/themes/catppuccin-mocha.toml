[theme]
name = "catppuccin_mocha"
description = "Catppuccin Mocha — soothing pastel dark theme"

[editor]
bg = "#1E1E2E"
fg = "#CDD6F4"
cursor = "#F5E0DC"
selection = "#45475A"
gutter = "#1E1E2E"
gutter_active = "#CDD6F4"
indent_guide = "#6C708640"
rainbow_brackets = ["#F38BA8", "#F5C2E7", "#F9E2AF", "#A6E3A1", "#89B4FA", "#CBA6F7"]

[ui]
bg = "#181825"
sidebar_bg = "#1E1E2E"
panel_bg = "#1E1E2E"
terminal_bg = "#11111B"
overlay_bg = "#181825D9"
status_bar_bg = "#1E1E2E"
border_color = "#313244"
selection_bg = "#313244"
dirty_indicator = "#F9E2AF"

fg = "#CDD6F4"
fg_dim = "#A6ADC8"
fg_ghost = "#6C7086"

accent = "#89B4FA"
cyan = "#94E2D5"
magenta = "#CBA6F7"
amber = "#F9E2AF"
success = "#A6E3A1"
warning = "#FAB387"
info = "#89B4FA"
error = "#F38BA8"

mode_normal = "#89DCEB"
mode_insert = "#A6E3A1"
mode_visual = "#CBA6F7"


top_bar_height = 36.0

[git]
modified_sidebar = "#F9E2AF"
added_sidebar = "#A6E3A1"
modified_gutter = "#F9E2AF"
added_gutter = "#A6E3A1"
deleted_gutter = "#F38BA8"
status_bar_height = 32.0


[syntax]
keyword = "#cba6f7"       # Mauve (Catppuccin identity)
operator = "#89dceb"      # Sky (Catppuccin palette)
punctuation = "#bac2de"
string = "#a6e3a1"
number = "#fab387"
boolean = "#fab387"
escape = "#f38ba8"
identifier = "#cdd6f4"    # Text (cho variable references)
variable = "#f5c2e7"      # Pink (khác với identifier #cdd6f4)
function = "#89b4fa"
macro = "#f5c2e7"
parameter = "#eba0ac"     # Flamingo (Catppuccin palette)
type = "#f9e2af"
constructor = "#f9e2af"
field = "#89dceb"         # Sky (Catppuccin palette)
property = "#89dceb"      # Sky (đồng bộ với field)
constant = "#fab387"
comment = "#6c7086"
attribute = "#cba6f7"     # Mauve (đồng bộ keyword)
namespace = "#cba6f7"
lifetime = "#fab387"
tag = "#f38ba8"
