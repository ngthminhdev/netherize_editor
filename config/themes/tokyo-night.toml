[theme]
name = "tokyo_night"
description = "Dark neon city vibe theme for Netherize Editor"

[editor]
bg = "#1A1B26"
fg = "#C0CAF5"
cursor = "#7AA2F7"
selection = "#283457"
gutter = "#1A1B26"
gutter_active = "#C0CAF5"

[ui]
bg = "#16161E"
sidebar_bg = "#1A1B26"
panel_bg = "#1A1B26"
terminal_bg = "#0F0F14"
overlay_bg = "#16161ED9"
status_bar_bg = "#1A1B26"
border_color = "#2A2A3A"
selection_bg = "#33467C"

fg = "#C0CAF5"
fg_dim = "#565F89"
fg_ghost = "#414868"

accent = "#7AA2F7"
cyan = "#7DCFFF"
magenta = "#BB9AF7"
amber = "#E0AF68"
success = "#9ECE6A"
warning = "#FF9E64"
info = "#7AA2F7"
error = "#F7768E"

mode_normal = "#7DCFFF"
mode_insert = "#9ECE6A"
mode_visual = "#BB9AF7"


top_bar_height = 36.0

[git]
modified_sidebar = "#E0AF68"
added_sidebar = "#9ECE6A"
modified_gutter = "#E0AF68"
added_gutter = "#9ECE6A"
deleted_gutter = "#F7768E"
status_bar_height = 32.0


[syntax]
keyword = "#BB9AF7"       # Purple (Tokyo Night identity)
string = "#9ECE6A"
function = "#7AA2F7"
comment = "#565F89"
type = "#2AC3DE"
number = "#FF9E64"
identifier = "#C0CAF5"    # Foreground color (cho variable references)
parameter = "#E0AF68"     # Amber (Tokyo Night palette)
field = "#7DCFFF"         # Cyan (Tokyo Night palette)
property = "#7DCFFF"      # Cyan (đồng bộ với field)
constant = "#BB9AF7"
operator = "#E0AF68"      # Amber (Tokyo Night palette)
punctuation = "#C0CAF5"
macro = "#7DCFFF"
lifetime = "#E0AF68"
boolean = "#FF9E64"
escape = "#FF9E64"
variable = "#BB9AF7"      # Purple (khác với identifier #C0CAF5)
constructor = "#BB9AF7"
attribute = "#BB9AF7"     # Purple (đồng bộ keyword)
namespace = "#7AA2F7"
tag = "#7AA2F7"
