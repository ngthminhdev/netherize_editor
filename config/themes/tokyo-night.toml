[theme]
name = "tokyo_night"
description = "Dark neon city vibe theme for Netherize Editor"

[editor]
bg = "#1A1B26"
fg = "#C0CAF5"
cursor = "#7AA2F7"
selection = "#283457"
gutter = "#1A1B26"
gutter_active = "#C0CAF5"
font_size = 15.0
line_height = 26.0
font_family = "Google Sans Code"
nerd_font_family = "Hack Nerd Font"

[ui]
bg = "#16161E"
sidebar_bg = "#13131A"
panel_bg = "#13131A"
terminal_bg = "#0F0F14"
overlay_bg = "#16161ED9"
status_bar_bg = "#0D0D12"
border_color = "#2A2A3A"
selection_bg = "#33467C"

fg = "#C0CAF5"
fg_dim = "#565F89"
fg_ghost = "#414868"

accent = "#7AA2F7"
cyan = "#7DCFFF"
magenta = "#BB9AF7"
amber = "#E0AF68"
success = "#9ECE6A"
warning = "#FF9E64"
info = "#7AA2F7"
error = "#F7768E"

mode_normal = "#7DCFFF"
mode_insert = "#9ECE6A"
mode_visual = "#BB9AF7"

sidebar_font_size = 15.0
sidebar_line_height = 22.0
panel_font_size = 14.0
panel_line_height = 22.0

sidebar_width = 280.0
right_sidebar_width = 320.0
bottom_panel_height = 220.0
top_bar_height = 36.0

[git]
modified_sidebar = "#E0AF68"
added_sidebar = "#9ECE6A"
modified_gutter = "#E0AF68"
added_gutter = "#9ECE6A"
deleted_gutter = "#F7768E"
status_bar_height = 32.0

[icons]
explorer_file_marker = "·"
explorer_folder_collapsed_marker = "▶"
explorer_folder_expanded_marker = "▼"
file_picker_dot = "●"

[icons.folder_closed]
glyph = "\uF07B"
color = "#E0AF68"

[icons.folder_open]
glyph = "\uF07C"
color = "#E0AF68"

[icons.default_file]
glyph = "\uF15B"
color = "#565F89"

[icons.rust]
glyph = "\uE7A8"
color = "#FF9E64"

[icons.javascript]
glyph = "\uE781"
color = "#E0AF68"

[icons.typescript]
glyph = "\uE628"
color = "#7AA2F7"

[icons.tsx]
glyph = "\uE7BA"
color = "#7AA2F7"

[icons.jsx]
glyph = "\uE7BA"
color = "#E0AF68"

[icons.python]
glyph = "\uE73C"
color = "#7AA2F7"

[icons.go]
glyph = "\uE724"
color = "#7DCFFF"

[icons.config]
glyph = "\uE615"
color = "#565F89"

[icons.json]
glyph = "\uE60B"
color = "#E0AF68"

[icons.markdown]
glyph = "\uF48A"
color = "#7AA2F7"

[icons.html]
glyph = "\uE736"
color = "#F7768E"

[icons.css]
glyph = "\uE749"
color = "#7AA2F7"

[icons.sass]
glyph = "\uE603"
color = "#BB9AF7"

[icons.shell]
glyph = "\uF489"
color = "#9ECE6A"

[icons.git]
glyph = "\uF1D3"
color = "#FF9E64"

[icons.lock]
glyph = "\uF13E"
color = "#565F89"

[icons.image]
glyph = "\uF1C5"
color = "#9ECE6A"

[file_icons]
default_file = "📄"
default_folder = "📁"

[file_icons.extensions]
rs = ""
ts = ""
tsx = ""
js = ""
jsx = ""
go = ""
json = ""
jsonc = ""
yaml = ""
yml = ""
toml = ""
sql = ""
md = ""
mdx = ""
dockerfile = ""
sh = ""
bash = ""
zsh = ""
fish = ""
lock = ""

[file_icons.exact]
Dockerfile = ""
"docker-compose.yml" = ""
"docker-compose.yaml" = ""
".gitignore" = ""
".gitattributes" = ""
".gitmodules" = ""
"package.json" = ""
"package-lock.json" = ""
"tsconfig.json" = ""
"Cargo.toml" = ""
Makefile = ""
"README.md" = ""

[syntax]
keyword = "#BB9AF7"
string = "#9ECE6A"
function = "#7AA2F7"
comment = "#565F89"
type = "#2AC3DE"
number = "#FF9E64"
identifier = "#C0CAF5"
parameter = "#E0AF68"
field = "#7DCFFF"
property = "#7DCFFF"
constant = "#BB9AF7"
operator = "#89DDFF"
punctuation = "#C0CAF5"
macro = "#7DCFFF"
lifetime = "#E0AF68"
boolean = "#FF9E64"
escape = "#FF9E64"
variable = "#C0CAF5"
constructor = "#BB9AF7"
attribute = "#E0AF68"
namespace = "#7AA2F7"
tag = "#F7768E"
