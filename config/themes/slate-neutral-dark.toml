[theme]
name = "slate-neutral-dark"
description = "Neutral slate dark theme with balanced contrast for long coding sessions"

[editor]
bg = "#1f2228"
fg = "#d6dae3"
cursor = "#a9b4c8"
selection = "#2b303a"
gutter = "#1f2228"
