# Theme metadata shown after the profile is loaded.
[theme]
name = "slate-neutral-dark"
description = "Neutral slate dark theme with balanced contrast for long coding sessions"

# Core editor surface: text buffer, caret, selection, and gutter.
[editor]
# Main text canvas background for the center editor region.
bg = "#1f2228"
# Default foreground color for plain text in the editor.
fg = "#d6dae3"
# Caret / cursor color in insert, normal, and visual rendering.
cursor = "#a9b4c8"
# Selection fill used by visual mode and selected ranges.
selection = "#2b303a"
# Background behind line numbers.
gutter = "#1f2228"
# Active line-number color in the gutter.
gutter_active = "#cfd5e2"
# Subtle vertical indentation guides in the code area.
indent_guide = "#7d859640"
# Nested bracket colors used for rainbow-style pair rendering.
rainbow_brackets = ["#9fb0c9", "#caaecf", "#d0bc8a", "#9ebba6", "#cfa691", "#b3aed4"]
# Editor text metrics for cosmic-text layout.
font_size = 14.0
line_height = 22.0
# Primary font for editor text, overlays, top bar, and status bar.
font_family = "Google Sans Code"
# Nerd Font used for explorer/file icons and terminal glyph fallback.
nerd_font_family = "Hack Nerd Font"

# Shared UI chrome colors and workbench sizing tokens.
[ui]
# Window clear color behind every region and palette pill foreground base.
bg = "#1a1d23"
# Left/right sidebar region background.
sidebar_bg = "#1f2228"
# Generic chrome background for top bar, cards, and inspector surfaces.
panel_bg = "#1f2228"
# Bottom terminal panel and terminal-buffer background.
terminal_bg = "#1f2228"
# Scrim + modal panel background for command palette and Leap overlay.
overlay_bg = "#171a20D9"
# Status bar region background.
status_bar_bg = "#1f2228"
# Borders, separators, and subtle region dividers.
border_color = "#12151b"
# Active row / selected tab / focused list item background.
selection_bg = "#313744"
# Unsaved topbar tab marker color.
dirty_indicator = "#d7b26d"

# Shared foreground tokens for labels and chrome text.
fg = "#d0d7e4"
fg_dim = "#b7bdc9"
fg_ghost = "#8790a1"

# Accent and semantic colors used across overlays, status pills, icons, and diagnostics.
accent = "#9ca7ba"
cyan = "#9fb0c9"
magenta = "#caaecf"
amber = "#d0bc8a"
success = "#9ebba6"
warning = "#cfa691"
info = "#9ebbd4"
error = "#c98989"

# Mode badge colors in the status bar.
mode_normal = "#9fb0c9"
mode_insert = "#9ebba6"
mode_visual = "#caaecf"

# Sidebar and panel text metrics.
sidebar_font_size = 14.0
sidebar_line_height = 22.0
panel_font_size = 14.0
panel_line_height = 22.0

# Theme-driven workbench chrome sizes.
sidebar_width = 280.0
right_sidebar_width = 540.0
bottom_panel_height = 220.0
top_bar_height = 36.0

[git]
modified_sidebar = "#cdb894"
added_sidebar = "#9dbfa4"
modified_gutter = "#cdb894"
added_gutter = "#8eb59a"
deleted_gutter = "#c58f8f"
status_bar_height = 32.0

# Disclosure markers and file-picker bullet glyph.
[icons]
# Marker for plain files in the explorer tree.
explorer_file_marker = "·"
# Marker for collapsed folders.
explorer_folder_collapsed_marker = "▶"
# Marker for expanded folders.
explorer_folder_expanded_marker = "▼"
# Dot marker rendered in file picker style rows.
file_picker_dot = "●"

# Folder icons in the explorer tree.
[icons.folder_closed]
glyph = "\uF07B"
color = "#d0bc8a"

[icons.folder_open]
glyph = "\uF07C"
color = "#d0bc8a"

# Generic fallback file icon.
[icons.default_file]
glyph = "\uF15B"
color = "#8790a1"

