[theme]
name = "default-dark"

[editor]
bg = "#0d1017"
fg = "#f2f4f8"
cursor = "#9BE564"
selection = "#1e2535"
gutter = "#5e6575"
gutter_active = "#d8deea"
font_size = 15.0
line_height = 26.0
font_family = "Menlo"

[ui]
bg = "#07080d"
sidebar_bg = "#0f1320"
panel_bg = "#121622"
terminal_bg = "#0b0f18"
overlay_bg = "#05070c"
status_bar_bg = "#111111"
border_color = "#1e2535"
selection_bg = "#1e2535"
fg = "#f2f4f8"
fg_dim = "#b7bfcc"
fg_faint = "#8f98aa"
fg_ghost = "#6d7483"
accent = "#9BE564"
cyan = "#2FD3F6"
magenta = "#E77AE9"
amber = "#F5B63A"
success = "#67D67C"
warning = "#F2B84B"
info = "#49C6F8"
error = "#FF7B72"
sidebar_font_size = 15.0
sidebar_line_height = 22.0
panel_font_size = 14.0
