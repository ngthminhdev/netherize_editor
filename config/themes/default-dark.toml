[syntax]
# ── Lõi ngôn ngữ (Core) ──
# Keywords like `fn`, `let`, `match`, `const`, `if`, `return`, `async`.
keyword = "#EACD61"       # Gold (Default Dark identity)
# Operators such as `=`, `+`, `&&`, `->`, `!`, `??`.
operator = "#EACD61"      # Blue-gray (Default Dark palette)
# Punctuation such as commas, braces, and separators.
punctuation = "#d0d7e466"

# ── Giá trị (Literals) ──
# String literals.
string = "#3CEC85"
# Numeric literals.
number = "#E35535"
# Boolean literals (true/false).
boolean = "#FF955C"
# Escape sequences inside strings (e.g., \n, \t).
escape = "#FF955C"

# ── Định danh (Identifiers) ──
# Plain variable names that do not fall into a richer semantic bucket.
identifier = "#d0d7e4"    # Foreground (cho variable references)
# Local variables (const, let, var).
variable = "#FF738A"      # Cyan (khác với identifier #d0d7e4)
# Function names and callable symbols.
function = "#69C3FF"      # Blue (Default Dark palette)
# Macro invocation highlight.
macro = "#69C3FF"
# Function and closure parameters.
parameter = "#F38CEC"     # Cyan (Default Dark palette)

# ── Hướng đối tượng & Cấu trúc (OOP & Structs) ──
# Type names.
type = "#B78AFF"
# Constructor functions (e.g., String::new).
constructor = "#A4EF58"
# Struct field declarations and member access like `self.name`, `obj.property`.
field = "#d0d7e4"         # Blue (Default Dark palette)
# Struct literal property labels like `Demo { name: value }`.
property = "#d0d7e4"      # Blue (đồng bộ với field)
# Named constants such as `MAX_SIZE`.
constant = "#E35535"

# ── Đặc tả ngôn ngữ (Language-specific) ──
# Comments and muted inline docs.
comment = "#4a5e84"
# Decorators and attributes like `#[derive(Debug)]` or `@Controller`.
attribute = "#F38CEC"     # [MỚI] Dùng màu Vàng Gold giống keyword để làm nổi bật các annotation
# Module namespaces (e.g., `std::` in Rust).
namespace = "#B78AFF"
# Rust lifetime highlight.
lifetime = "#FF955C"
# HTML/XML/JSX Tags.
tag = "#69C3FF"           # Deep Blue (đồng bộ function)
keyword_control = "#EACD61"       # Gold (Default Dark identity)
keyword_storage = "#22ECDB"       # Gold (Default Dark identity)
string_escape = "#FF955C"
function_builtin = "#69C3FF"      # Blue (Default Dark palette)
comment_doc = "#4a5e84"
type_builtin = "#B78AFF"
variable_builtin = "#FF738A"      # Cyan (khác với identifier #d0d7e4)
markup_strong = "#EACD61"       # Gold (Default Dark identity)
markup_italic = "#4a5e84"
markup_inline_code = "#3CEC85"
markup_link = "#69C3FF"      # Blue (Default Dark palette)
