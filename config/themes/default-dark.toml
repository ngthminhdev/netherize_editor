# Theme metadata shown after the profile is loaded.
[theme]
name = "bearded-arc"
description = "Bearded Theme Arc palette converted from JSON/Zed style for Netherize Editor"

# Core editor surface: text buffer, caret, selection, and gutter.
[editor]
# Main text canvas background for the center editor region.
bg = "#1c2433"
# Default foreground color for plain text in the editor.
fg = "#d0d7e4"
# Caret / cursor color in insert, normal, and visual rendering.
cursor = "#22ECDB"
# Selection fill used by visual mode and selected ranges.
selection = "#253043"
# Background behind line numbers.
gutter = "#1c2433"
# Active line-number color in the gutter.
gutter_active = "#7d91b8"
# Subtle vertical indentation guides in the code area.
indent_guide = "#d0d7e41a"
# Nested bracket colors used for rainbow-style pair rendering.
rainbow_brackets = ["#22ECDB", "#F38CEC", "#EACD61", "#3CEC85", "#FF955C", "#B78AFF"]
# Editor text metrics for cosmic-text layout.
font_size = 14.0
line_height = 22.0
# Primary font for editor text, overlays, top bar, and status bar.
font_family = "Google Sans Code"
# Nerd Font used for explorer/file icons and terminal glyph fallback.
nerd_font_family = "Hack Nerd Font"

# Shared UI chrome colors and workbench sizing tokens.
[ui]
# Window clear color behind every region and palette pill foreground base.
bg = "#181f2c"
# Left/right sidebar region background.
sidebar_bg = "#1c2433"
# Generic chrome background for top bar, cards, and inspector surfaces.
panel_bg = "#1c2433"
# Bottom terminal panel and terminal-buffer background.
terminal_bg = "#1c2433"
# Scrim + modal panel background for command palette and Leap overlay.
overlay_bg = "#181f2cD9"
# Status bar region background.
status_bar_bg = "#181f2c"
# Borders, separators, and subtle region dividers.
border_color = "#11161f"
# Active row / selected tab / focused list item background.
selection_bg = "#2a364d"
# Unsaved topbar tab marker color.
dirty_indicator = "#FF955C"

# Shared foreground tokens for labels and chrome text.
fg = "#d0d7e4"
fg_dim = "#afbbd2"
fg_ghost = "#4a5e84"

# Accent and semantic colors used across overlays, status pills, icons, and diagnostics.
accent = "#8196b5"
cyan = "#22ECDB"
magenta = "#F38CEC"
amber = "#EACD61"
success = "#3CEC85"
warning = "#FF955C"
info = "#69C3FF"
error = "#E35535"

# Mode badge colors in the status bar.
mode_normal = "#22ECDB"
mode_insert = "#3CEC85"
mode_visual = "#F38CEC"

# Sidebar and panel text metrics.
sidebar_font_size = 14.0
sidebar_line_height = 22.0
panel_font_size = 14.0
panel_line_height = 22.0

# Theme-driven workbench chrome sizes.
sidebar_width = 280.0
right_sidebar_width = 650.0
bottom_panel_height = 420.0
top_bar_height = 36.0

[git]
modified_sidebar = "#69C3FF"
added_sidebar = "#3CEC85"
modified_gutter = "#69C3FF"
added_gutter = "#3CEC85"
deleted_gutter = "#E35535"
status_bar_height = 32.0

# Disclosure markers and file-picker bullet glyph.
[icons]
# Marker for plain files in the explorer tree.
explorer_file_marker = ""
# Marker for collapsed folders.
explorer_folder_collapsed_marker = ""
# Marker for expanded folders.
explorer_folder_expanded_marker = ""
# Dot marker rendered in file picker style rows.
file_picker_dot = "●"

# Bearded Icons are builtin assets under assets/bearded-icons.
# File icon overrides are intentionally omitted so the builtin Bearded resolver is authoritative.

[syntax]
# ── Lõi ngôn ngữ (Core) ──
# Keywords like `fn`, `let`, `match`, `const`, `if`, `return`, `async`.
keyword = "#EACD61"       # Gold (Default Dark identity)
# Operators such as `=`, `+`, `&&`, `->`, `!`, `??`.
operator = "#EACD61"      # Blue-gray (Default Dark palette)
# Punctuation such as commas, braces, and separators.
punctuation = "#d0d7e499"

# ── Giá trị (Literals) ──
# String literals.
string = "#3CEC85"
# Numeric literals.
number = "#E35535"
# Boolean literals (true/false).
boolean = "#FF955C"
# Escape sequences inside strings (e.g., \n, \t).
escape = "#FF955C"

# ── Định danh (Identifiers) ──
# Plain variable names that do not fall into a richer semantic bucket.
identifier = "#d0d7e4"    # Foreground (cho variable references)
# Local variables (const, let, var).
variable = "#FF738A"      # Cyan (khác với identifier #d0d7e4)
# Function names and callable symbols.
function = "#69C3FF"      # Blue (Default Dark palette)
# Macro invocation highlight.
macro = "#69C3FF"
# Function and closure parameters.
parameter = "#F38CEC"     # Cyan (Default Dark palette)

# ── Hướng đối tượng & Cấu trúc (OOP & Structs) ──
# Type names.
type = "#B78AFF"
# Constructor functions (e.g., String::new).
constructor = "#A4EF58"
# Struct field declarations and member access like `self.name`, `obj.property`.
field = "#d0d7e4"         # Blue (Default Dark palette)
# Struct literal property labels like `Demo { name: value }`.
property = "#d0d7e4"      # Blue (đồng bộ với field)
# Named constants such as `MAX_SIZE`.
constant = "#E35535"

# ── Đặc tả ngôn ngữ (Language-specific) ──
# Comments and muted inline docs.
comment = "#4a5e84"
# Decorators and attributes like `#[derive(Debug)]` or `@Controller`.
attribute = "#F38CEC"     # [MỚI] Dùng màu Vàng Gold giống keyword để làm nổi bật các annotation
# Module namespaces (e.g., `std::` in Rust).
namespace = "#B78AFF"
# Rust lifetime highlight.
lifetime = "#FF955C"
# HTML/XML/JSX Tags.
tag = "#69C3FF"           # Deep Blue (đồng bộ function)
keyword_control = "#EACD61"       # Gold (Default Dark identity)
keyword_storage = "#22ECDB"       # Gold (Default Dark identity)
string_escape = "#FF955C"
function_builtin = "#69C3FF"      # Blue (Default Dark palette)
comment_doc = "#4a5e84"
type_builtin = "#B78AFF"
variable_builtin = "#FF738A"      # Cyan (khác với identifier #d0d7e4)
markup_strong = "#EACD61"       # Gold (Default Dark identity)
markup_italic = "#4a5e84"
markup_inline_code = "#3CEC85"
markup_link = "#69C3FF"      # Blue (Default Dark palette)
