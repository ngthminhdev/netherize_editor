ts = ""
tsx = ""
js = ""
jsx = ""
go = ""
json = ""
jsonc = ""
yaml = ""
yml = ""
toml = ""
sql = ""
md = ""
mdx = ""
dockerfile = ""
sh = ""
bash = ""
zsh = ""
fish = ""
lock = ""

[file_icons.exact]
Dockerfile = ""
"docker-compose.yml" = ""
"docker-compose.yaml" = ""
".gitignore" = ""
".gitattributes" = ""
".gitmodules" = ""
"package.json" = ""
"package-lock.json" = ""
